name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true

      - name: Restore
        run: dotnet restore AutoClicker.sln

      - name: Build
        run: dotnet build AutoClicker.sln --no-restore

      - name: Test
        run: dotnet test AutoClicker.sln --no-build
